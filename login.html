
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Farm To Home</title>
<style>
*{margin:0; padding:0; box-sizing:border-box; font-family: Arial;}
body{background:#f5f5f5; display:flex; align-items:center; justify-content:center; min-height:100vh;}
.login-box{
  background:white; width:360px; padding:40px; border-radius:12px;
  box-shadow:0 10px 30px rgba(0,0,0,0.1); text-align:center;
}
.login-box h1{font-size:24px; margin-bottom:20px; color:#333;}
.login-box p{font-size:14px; color:#666; margin-bottom:30px;}

.input-field{
  position:relative; margin-bottom:20px;
}
.input-field input{
  width:100%; padding:14px; border:1px solid #ddd; border-radius:8px;
  outline:none; font-size:14px; background:#f9f9f9;
}
.input-field label{
  position:absolute; left:14px; top:14px; color:#aaa; font-size:14px;
  transition:0.2s; pointer-events:none;
}
.input-field input:focus + label,
.input-field input:not(:placeholder-shown) + label{
  top:-8px; left:10px; background:white; padding:0 4px; font-size:12px;
}

.login-btn{
  width:100%; padding:14px; background:#0A84FF; color:white; border:none;
  border-radius:8px; font-weight:bold; cursor:pointer; margin-top:10px;
}
.login-btn:hover{background:#0066d6;}

.divider{margin:20px 0; display:flex; align-items:center; gap:10px;}
.divider span{color:#aaa; font-size:14px;}
.divider::before, .divider::after{
  content:''; flex:1; height:1px; background:#eee;
}

.google-btn{
  width:100%; padding:12px; border:1px solid #ddd; border-radius:8px;
  display:flex; align-items:center; justify-content:center; gap:10px; cursor:pointer;
}
.google-btn img{width:20px;}
</style>
</head>
<body>

<div class="login-box">
  <h1>Welcome back!</h1>
  <p>Login to your Farm To Home account</p>
  
  <div class="input-field">
    <input type="text" id="username" placeholder=" ">
    <label for="username">Username or Email</label>
  </div>
  
  <div class="input-field">
    <input type="password" id="password" placeholder=" ">
    <label for="password">Password</label>
  </div>
  
  <button class="login-btn">Login</button>
  
  <div class="divider"><span>or</span></div>
  
  <button class="google-btn">
    
    Continue with Google
  </button>
</div>

</body>
</html>
